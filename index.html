<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#1f3b2d">
  <meta name="description" content="Offline-Wanderkarte La Gomera: GR 131 & GR 132 mit Wildcamping-Spots, Wasser, Läden und Restaurants">
  <title>Gomera Trek</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="map" aria-label="Karte"></div>

  <header id="topbar">
    <div id="chips" class="chips" role="toolbar" aria-label="Filter"></div>
    <div id="status" class="status hidden" aria-live="polite"></div>
  </header>

  <div id="fabs">
    <button id="btn-locate" class="fab" title="Mein Standort" aria-label="Mein Standort">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke-width="2" stroke="currentColor" fill="none"/><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <button id="btn-ahead" class="fab" title="Was kommt als Nächstes?" aria-label="Was kommt als Nächstes?">⏭</button>
  </div>

  <nav id="bottombar">
    <button data-view="map" class="active"><span>🗺️</span>Karte</button>
    <button data-view="list"><span>📋</span>Liste</button>
    <button data-view="plan"><span>🥾</span>8 Tage</button>
    <button data-view="settings"><span>⚙️</span>Offline</button>
  </nav>

  <section id="panel-list" class="panel hidden" aria-label="Liste">
    <div class="panel-head">
      <input id="search" type="search" placeholder="Suchen (Name, Ort, Hinweis) …" autocomplete="off">
      <select id="sort" aria-label="Sortierung">
        <option value="route132">Entlang GR 132</option>
        <option value="route131">Entlang GR 131</option>
        <option value="me">Entfernung zu mir</option>
        <option value="ahead">Voraus ab meiner Position (Tour)</option>
      </select>
    </div>
    <div id="list-chips" class="chips small"></div>
    <div id="list" class="list"></div>
  </section>

  <section id="panel-plan" class="panel hidden" aria-label="Etappenplan"></section>
  <section id="panel-settings" class="panel hidden" aria-label="Offline &amp; Einstellungen"></section>

  <div id="sheet" class="sheet" aria-hidden="true">
    <div class="sheet-handle" id="sheet-handle"><span></span></div>
    <button class="sheet-close" id="sheet-close" aria-label="Schließen">✕</button>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
